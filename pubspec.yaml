name: workpulse
description: WorkPulse — Employee Self-Service mobile application (frontend only).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  google_fonts: ^6.2.1
  intl: ^0.19.0
  dio: ^5.4.3
  flutter_secure_storage: ^9.2.2
  geolocator: ^12.0.0
  permission_handler: ^11.3.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  connectivity_plus: ^6.0.3
  shared_preferences: ^2.2.3
  uuid: ^4.3.3
  url_launcher: ^6.2.5
  image_picker: ^1.0.7
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true